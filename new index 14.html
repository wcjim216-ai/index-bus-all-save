<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港全能交通與天氣助手 (HK Transit Weather Master)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS (按鈕觸發才開啟) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

  <!-- 特別交通改道 / 颱風警報滾動橫幅 -->
  <div id="traffic-alert-bar" class="hidden bg-red-700 text-white text-xs px-4 py-2 font-bold flex items-center justify-between z-20 shadow-md">
    <div class="flex items-center space-x-2 overflow-hidden">
      <span class="animate-pulse">⚠️ 交通改道/颱風特別通告：</span>
      <span id="traffic-alert-text" class="truncate">載入特別交通消息中...</span>
    </div>
    <button onclick="document.getElementById('traffic-alert-bar').classList.add('hidden')" class="ml-2 font-bold text-sm">✕</button>
  </div>

  <!-- 天文台實時天氣與警告列 -->
  <div class="bg-gray-800 border-b border-gray-700 px-4 py-2 flex flex-wrap justify-between items-center text-xs text-gray-300">
    <div class="flex items-center space-x-3">
      <span id="weather-temp" class="text-amber-400 font-bold text-sm">🌡️ --°C</span>
      <span id="weather-humidity">💧 濕度: --%</span>
      <span id="weather-rain-prob" class="bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded">🌧️ 落雨機會: 低</span>
    </div>
    <div id="weather-warning-tags" class="flex space-x-1 mt-1 sm:mt-0">
      <span class="bg-gray-700 px-2 py-0.5 rounded text-[11px]">天氣訊號更新中...</span>
    </div>
  </div>

  <!-- 頂部導航頁籤 (Tab 拆分) -->
  <header class="bg-gray-800 border-b border-gray-700 px-4 py-2.5 flex justify-between items-center z-10 shadow-md">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🚌</span>
      <h1 class="font-bold text-base text-white tracking-wide">HK Transit Master</h1>
    </div>
    
    <nav class="flex bg-gray-700 p-1 rounded-lg space-x-1">
      <button id="tab-btn-search" onclick="switchTab('search')" class="px-3 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white transition">🔍 搵交通</button>
      <button id="tab-btn-fav" onclick="switchTab('fav')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-300 hover:text-white transition">⭐ 我的收藏</button>
      <button id="tab-btn-forecast" onclick="switchTab('forecast')" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-300 hover:text-white transition">🌤️ 未來天氣</button>
    </nav>
  </header>

  <!-- 主要工作區 -->
  <main class="flex-1 overflow-hidden relative max-w-3xl w-full mx-auto p-4 custom-scrollbar overflow-y-auto">
    
    <!-- ================= 分頁 1：搜尋路線 / 交通工具 ================= -->
    <div id="view-search" class="space-y-4">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3 shadow-lg">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">1. 選擇交通工具類別</label>
          <select id="transport-type" onchange="toggleTransportMode()" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-white">
            <option value="KMB">🚌 九巴 (KMB)</option>
            <option value="CTB">🚌 城巴 (CTB)</option>
            <option value="MTR">🚇 港鐵 (MTR 重鐵)</option>
            <option value="LRT">🚃 輕鐵 (Light Rail)</option>
            <option value="FERRY">⛴️ 渡輪/船隻 (Ferry)</option>
            <option value="GMB">🚐 專線小巴 (GMB)</option>
          </select>
        </div>

        <!-- 巴士與小巴搜尋框 -->
        <div id="bus-input-box">
          <label class="block text-xs font-semibold text-gray-300 mb-1">2. 輸入路線號碼</label>
          <div class="flex space-x-2">
            <input type="text" id="route-input" placeholder="例如: 1A, 102, 269C, 68X" class="flex-1 bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm uppercase focus:outline-none focus:border-blue-500 text-white">
            <button onclick="searchBusRoute()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md">搜尋</button>
          </div>
        </div>

        <!-- 港鐵路線下拉框 -->
        <div id="mtr-input-box" class="hidden">
          <label class="block text-xs font-semibold text-gray-300 mb-1">2. 選擇港鐵鐵路綫</label>
          <select id="mtr-line-select" onchange="loadMTRStops()" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white">
            <option value="">-- 請選擇鐵路線 --</option>
            <option value="KTL">觀塘綫 (Kwun Tong Line)</option>
            <option value="ISL">港島綫 (Island Line)</option>
            <option value="TWL">荃灣綫 (Tsuen Wan Line)</option>
            <option value="SIL">南港島綫 (South Island Line)</option>
            <option value="TCL">東湧綫 (Tung Chung Line)</option>
            <option value="TML">屯馬綫 (Tuen Ma Line)</option>
            <option value="EAL">東鐵綫 (East Rail Line)</option>
            <option value="AEL">機場快綫 (Airport Express)</option>
          </select>
        </div>

        <!-- 輕鐵車站選擇 -->
        <div id="lrt-input-box" class="hidden">
          <label class="block text-xs font-semibold text-gray-300 mb-1">2. 選擇輕鐵站點</label>
          <select id="lrt-station-select" onchange="loadLRTETA()" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white">
            <option value="">-- 請選擇輕鐵站 --</option>
            <option value="265">屯門碼頭 (Tuen Mun Ferry Pier)</option>
            <option value="295">市中心 (Town Centre)</option>
            <option value="300">元朗 (Yuen Long)</option>
            <option value="001">屯門 (Tuen Mun)</option>
            <option value="160">天水圍 (Tin Shui Wai)</option>
          </select>
        </div>

        <!-- 渡輪航線下拉框 -->
        <div id="ferry-input-box" class="hidden">
          <label class="block text-xs font-semibold text-gray-300 mb-1">2. 選擇渡輪航線</label>
          <select id="ferry-line-select" onchange="loadFerryPiers()" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white">
            <option value="">-- 請選擇渡輪航線 --</option>
            <option value="CENTRAL-TST">中環 ⇆ 尖沙咀 (天星小輪)</option>
            <option value="WANChAI-TST">灣仔 ⇆ 尖沙咀 (天星小輪)</option>
            <option value="CENTRAL-MW">中環 ⇆ 梅窩 (新渡輪)</option>
            <option value="CENTRAL-CC">中環 ⇆ 長洲 (新渡輪)</option>
          </select>
        </div>
      </div>

      <!-- 巴士明確方向選擇區域 -->
      <div id="dir-container" class="hidden bg-gray-800/80 p-3 rounded-xl border border-gray-700 space-y-2">
        <label class="block text-xs font-semibold text-gray-300">3. 選擇行車/航行方向：</label>
        <div class="grid grid-cols-1 gap-2" id="dir-buttons"></div>
      </div>

      <!-- 車站/碼頭列表 (100% 無漏站) -->
      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🚏 沿途所有車站/碼頭 (按下後即時載入 3-4 班班次)</h3>
        <div id="stops-container" class="space-y-2 text-sm text-gray-400">請先選擇或搜尋路線。</div>
      </div>
    </div>

    <!-- ================= 分頁 2：收藏車站 (每 5 秒獨立自動更新) ================= -->
    <div id="view-fav" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl border border-gray-700">
        <div>
          <h2 class="text-sm font-bold text-white flex items-center gap-1">⭐ 我的收藏車站/碼頭</h2>
          <span class="text-[11px] text-amber-400" id="fav-status-text">🔄 收藏頁每 5 秒自動更新中...</span>
        </div>
        <button onclick="renderFavorites()" class="text-xs bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/40 px-3 py-1.5 rounded-lg transition">手動刷新</button>
      </div>

      <div id="fav-list-container" class="space-y-3">
        <!-- 收藏清單動態渲染 -->
      </div>
    </div>

    <!-- ================= 分頁 3：未來天氣預報與氣象數據 ================= -->
    <div id="view-forecast" class="hidden space-y-4">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
        <h2 class="text-sm font-bold text-white mb-3 flex items-center gap-1">🌤️ 未來 9 天天氣預報 (香港天文台)</h2>
        <div id="forecast-container" class="space-y-2 text-xs text-gray-300">
          載入天文台預報數據中...
        </div>
      </div>
    </div>

  </main>

  <!-- 全域地圖 Modal 彈窗 (自行選擇開啟) -->
  <div id="map-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex flex-col p-4">
    <div class="flex justify-between items-center bg-gray-800 p-3 rounded-t-xl border-b border-gray-700">
      <h3 class="font-bold text-sm text-white" id="map-title">📍 車站地圖位置</h3>
      <button onclick="closeMapModal()" class="text-gray-400 hover:text-white font-bold text-lg px-2">✕</button>
    </div>
    <div class="flex-1 bg-gray-900 rounded-b-xl overflow-hidden relative">
      <div id="map" class="h-full w-full"></div>
    </div>
  </div>

  <script>
    // --- 全域變數與對照表 ---
    let map = null;
    let mapMarker = null;
    let favIntervalTimer = null;
    let favorites = JSON.parse(localStorage.getItem('hk_transit_favs_v8') || '[]');

    const mtrStations = {
      KTL: [
        { code: 'WHA', name: '黃埔' }, { code: 'HOM', name: '何文田' }, { code: 'YMT', name: '油麻地' },
        { code: 'MOK', name: '旺角' }, { code: 'PRE', name: '太子' }, { code: 'SKM', name: '石硤尾' },
        { code: 'KOT', name: '九龍塘' }, { code: 'LOF', name: '樂富' }, { code: 'WTS', name: '黃大仙' },
        { code: 'DIH', name: '鑽石山' }, { code: 'CHH', name: '彩虹' }, { code: 'KOB', name: '九龍灣' },
        { code: 'NTK', name: '牛頭角' }, { code: 'KWT', name: '觀塘' }, { code: 'LAT', name: '藍田' },
        { code: 'YAT', name: '油塘' }, { code: 'TIK', name: '調景嶺' }
      ],
      ISL: [
        { code: 'KET', name: '堅尼地城' }, { code: 'HKU', name: '香港大學' }, { code: 'SYP', name: '西營盤' },
        { code: 'SHW', name: '上環' }, { code: 'CEN', name: '中環' }, { code: 'ADM', name: '金鐘' },
        { code: 'WAC', name: '灣仔' }, { code: 'CAB', name: '銅鑼灣' }, { code: 'TIH', name: '天后' },
        { code: 'FOH', name: '炮台山' }, { code: 'NOP', name: '北角' }, { code: 'TAK', name: '鰂魚涌' },
        { code: 'QUB', name: '太古' }, { code: 'SKW', name: '筲箕灣' }, { code: 'HFC', name: '杏花邨' },
        { code: 'CHW', name: '柴灣' }
      ]
    };

    const ferryPiers = {
      'CENTRAL-TST': [{ code: 'C7', name: '中環7號碼頭', lat: 22.2871, long: 114.1602 }, { code: 'TST', name: '尖沙咀天星碼頭', lat: 22.2938, long: 114.1684 }],
      'CENTRAL-MW': [{ code: 'C6', name: '中環6號碼頭', lat: 22.2868, long: 114.1593 }, { code: 'MW', name: '梅窩渡輪碼頭', lat: 22.2647, long: 113.9992 }]
    };

    // --- 1. 天文台天氣與交通警告實時 API 載入 ---
    async function fetchWeatherAndTrafficAlerts() {
      try {
        // 實時天氣
        const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const wData = await wRes.json();
        
        if (wData.temperature && wData.temperature.data[0]) {
          document.getElementById('weather-temp').innerText = `🌡️ ${wData.temperature.data[0].value}°C`;
        }
        if (wData.humidity && wData.humidity.data[0]) {
          document.getElementById('weather-humidity').innerText = `💧 濕度: ${wData.humidity.data[0].value}%`;
        }

        // 警告標籤
        const warnTags = document.getElementById('weather-warning-tags');
        if (wData.warningMessage && wData.warningMessage.length > 0) {
          warnTags.innerHTML = wData.warningMessage.map(msg => `<span class="bg-red-600 text-white px-1.5 py-0.5 rounded font-bold text-[10px]">${msg}</span>`).join('');
        } else {
          warnTags.innerHTML = `<span class="bg-green-800 text-green-200 px-2 py-0.5 rounded text-[11px]">現時無天氣警告</span>`;
        }

        // 特別交通消息 (改道/颱風通告)
        const tRes = await fetch('https://rt.data.gov.hk/v1/transport/special-traffic-news');
        const tData = await tRes.json();
        if (tData.status === '1' && tData.news && tData.news.length > 0) {
          document.getElementById('traffic-alert-bar').classList.remove('hidden');
          document.getElementById('traffic-alert-text').innerText = tData.news[0].msg;
        }
      } catch (e) {}
    }
    fetchWeatherAndTrafficAlerts();
    setInterval(fetchWeatherAndTrafficAlerts, 60000); // 每分鐘更新一次氣象與交通改道消息

    // 載入未來 9 天天氣預報
    async function fetchForecast() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const data = await res.json();
        const container = document.getElementById('forecast-container');
        if (data.weatherForecast) {
          container.innerHTML = data.weatherForecast.map(f => `
            <div class="bg-gray-900 border border-gray-700/80 p-2.5 rounded-lg flex justify-between items-center">
              <div>
                <span class="font-bold text-amber-400">${f.forecastDate} (${f.week})</span>
                <p class="text-gray-300">${f.forecastForecast}</p>
              </div>
              <div class="text-right">
                <span class="font-bold text-white">${f.forecastmintemp.value}°C - ${f.forecastmaxtemp.value}°C</span>
                <p class="text-blue-400">💧 ${f.forecastrh.value}% | PSR: ${f.PSR || '中'}</p>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {}
    }

    // --- 2. Tab 切換與模式選取 ---
    function switchTab(tabName) {
      document.getElementById('view-search').classList.add('hidden');
      document.getElementById('view-fav').classList.add('hidden');
      document.getElementById('view-forecast').classList.add('hidden');

      document.getElementById('tab-btn-search').className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-300 hover:text-white transition";
      document.getElementById('tab-btn-fav').className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-300 hover:text-white transition";
      document.getElementById('tab-btn-forecast').className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-300 hover:text-white transition";

      if (favIntervalTimer) clearInterval(favIntervalTimer);

      if (tabName === 'search') {
        document.getElementById('view-search').classList.remove('hidden');
        document.getElementById('tab-btn-search').className = "px-3 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white transition";
      } else if (tabName === 'fav') {
        document.getElementById('view-fav').classList.remove('hidden');
        document.getElementById('tab-btn-fav').className = "px-3 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white transition";
        renderFavorites();
        favIntervalTimer = setInterval(() => {
          if (document.visibilityState === 'visible') {
            renderFavorites(true);
          }
        }, 5000);
      } else if (tabName === 'forecast') {
        document.getElementById('view-forecast').classList.remove('hidden');
        document.getElementById('tab-btn-forecast').className = "px-3 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white transition";
        fetchForecast();
      }
    }

    function toggleTransportMode() {
      const type = document.getElementById('transport-type').value;
      const busBox = document.getElementById('bus-input-box');
      const mtrBox = document.getElementById('mtr-input-box');
      const lrtBox = document.getElementById('lrt-input-box');
      const ferryBox = document.getElementById('ferry-input-box');
      const dirContainer = document.getElementById('dir-container');

      dirContainer.classList.add('hidden');
      document.getElementById('stops-container').innerHTML = '請選擇路線。';

      busBox.classList.add('hidden');
      mtrBox.classList.add('hidden');
      lrtBox.classList.add('hidden');
      ferryBox.classList.add('hidden');

      if (type === 'MTR') {
        mtrBox.classList.remove('hidden');
      } else if (type === 'LRT') {
        lrtBox.classList.remove('hidden');
      } else if (type === 'FERRY') {
        ferryBox.classList.remove('hidden');
      } else {
        busBox.classList.remove('hidden');
      }
    }

    // --- 3. 巴士搜尋機制 (100% 防漏站) ---
    async function searchBusRoute() {
      const type = document.getElementById('transport-type').value;
      const route = document.getElementById('route-input').value.trim().toUpperCase();
      const container = document.getElementById('stops-container');
      const dirContainer = document.getElementById('dir-container');
      const dirButtons = document.getElementById('dir-buttons');

      if (!route) {
        alert('請輸入路線號碼！');
        return;
      }

      container.innerHTML = `<div class="text-blue-400 py-4 text-center">正在搜尋 ${route} 路線數據 (防漏站檢索中)...</div>`;

      try {
        if (type === 'KMB') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}`);
          const routeMeta = await res.json();

          if (!routeMeta.data || routeMeta.data.length === 0) {
            container.innerHTML = `<div class="text-red-400 py-4 text-center">找不到路線 ${route}。</div>`;
            dirContainer.classList.add('hidden');
            return;
          }

          dirContainer.classList.remove('hidden');
          dirButtons.innerHTML = '';

          const addedDirections = new Set();
          routeMeta.data.forEach((item) => {
            const boundKey = `${item.bound}_${item.service_type}`;
            if (!addedDirections.has(boundKey)) {
              addedDirections.add(boundKey);
              const dirText = item.bound === 'O' ? '去程' : '回程';
              const serviceText = item.service_type !== '1' ? ` (特別班次 ${item.service_type})` : '';
              
              const btn = document.createElement('button');
              btn.className = "bg-gray-700 hover:bg-blue-600 text-white p-2.5 rounded-lg text-xs transition font-semibold text-left border border-gray-600 flex justify-between items-center";
              btn.innerHTML = `
                <span>🚩 ${dirText}：由 <strong>${item.orig_tc}</strong> 往 <strong>${item.dest_tc}</strong>${serviceText}</span>
                <span class="text-blue-400 font-bold">選擇 ➔</span>
              `;
              btn.onclick = () => loadAllStopsForKMB(route, item.bound, item.service_type);
              dirButtons.appendChild(btn);
            }
          });

          const firstMeta = routeMeta.data[0];
          loadAllStopsForKMB(route, firstMeta.bound, firstMeta.service_type);
        }
      } catch (err) {
        container.innerHTML = `<div class="text-red-400 py-4 text-center">連線開放數據失敗。</div>`;
      }
    }

    async function loadAllStopsForKMB(route, bound, serviceType) {
      const container = document.getElementById('stops-container');
      container.innerHTML = '<div class="text-gray-400 py-4 text-center">正在讀取全線完整車站...</div>';

      try {
        const dirParam = bound === 'O' ? 'outbound' : 'inbound';
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dirParam}/${serviceType}`);
        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          container.innerHTML = `<div class="text-red-400 py-4 text-center">此班次不設車站數據。</div>`;
          return;
        }

        const stopPromises = data.data.map(item => 
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`).then(r => r.json()).catch(() => null)
        );

        const stopResults = await Promise.allSettled(stopPromises);
        container.innerHTML = '';

        data.data.forEach((item, index) => {
          const stopInfo = stopResults[index].status === 'fulfilled' && stopResults[index].value ? stopResults[index].value.data : null;
          const stopName = stopInfo ? stopInfo.name_tc : `車站 (${item.stop})`;
          const lat = stopInfo ? stopInfo.lat :
