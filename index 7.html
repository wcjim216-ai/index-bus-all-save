<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港全能交通地圖助手 (HK Transit Master Pro)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; width: 100%; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

  <!-- 頂部導航欄 -->
  <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center z-10 shadow-md">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🚌</span>
      <h1 class="font-bold text-lg text-white tracking-wide">HK Transit Master Pro</h1>
    </div>
    <div class="flex bg-gray-700 p-1 rounded-lg">
      <button id="btn-mode-eta" onclick="switchTab('eta')" class="px-3 py-1 text-sm font-semibold rounded-md bg-blue-600 text-white transition">車站與 ETA</button>
      <button id="btn-mode-route" onclick="switchTab('route')" class="px-3 py-1 text-sm font-semibold rounded-md text-gray-300 hover:text-white transition">點對點導航</button>
    </div>
  </header>

  <!-- 主要工作區 -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- 側邊控制面板 -->
    <section id="sidebar" class="w-full md:w-96 bg-gray-800 border-r border-gray-700 flex flex-col z-10 custom-scrollbar overflow-y-auto p-4 space-y-4">
      
      <!-- 模式一：巴士搜尋 -> 方向選擇 -> 車站列表 -> ETA -->
      <div id="tab-eta-content" class="space-y-4">
        <div class="bg-gray-700/50 p-3 rounded-lg border border-gray-600 space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">1. 選擇交通工具</label>
            <select id="transport-type" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
              <option value="KMB">九巴 (KMB)</option>
              <option value="CTB">城巴 (CTB)</option>
              <option value="GMB">專線小巴 (綠小)</option>
              <option value="RMB">紅色小巴 (紅小)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">2. 輸入路線號碼</label>
            <div class="flex space-x-2">
              <input type="text" id="route-input" placeholder="例如: 1A, 102, 20" class="flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-sm uppercase focus:outline-none focus:border-blue-500">
              <button onclick="searchBusRoute()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-bold transition">搵路線</button>
            </div>
          </div>
        </div>

        <!-- 3. 方向選擇（動態載入） -->
        <div id="dir-container" class="hidden bg-gray-700/30 p-2 rounded border border-gray-600 space-y-2">
          <label class="block text-xs font-semibold text-gray-300">3. 選擇行車方向：</label>
          <div class="grid grid-cols-2 gap-2" id="dir-buttons"></div>
        </div>

        <!-- 5秒自動更新提示 -->
        <div id="refresh-indicator" class="hidden text-xs text-amber-400 bg-amber-950/40 border border-amber-800/50 p-2 rounded flex justify-between items-center">
          <span>🔄 [選定車站 ETA] 每 5 秒自動更新...</span>
          <span id="timer-sec" class="font-mono font-bold">5s</span>
        </div>

        <!-- 我的收藏 -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">⭐ 我的收藏車站</h3>
          <div id="fav-container" class="space-y-2"></div>
        </div>

        <!-- 4. 車站列表與 ETA 展示區 -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🚏 沿途車站列表 (點擊車站查看實時 ETA)</h3>
          <div id="stops-container" class="space-y-2 text-sm text-gray-400">請先輸入巴士路線進行搜尋。</div>
        </div>

        <!-- 5. 道路 CCTV 快照區 -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">📷 車站周邊道路 CCTV</h3>
          <div id="cctv-container" class="bg-gray-900 border border-gray-700 rounded p-2 text-center text-xs text-gray-500">
            點擊車站檢視附近的運輸署實時影像。
          </div>
        </div>
      </div>

      <!-- 模式二：點對點導航規劃 -->
      <div id="tab-route-content" class="hidden space-y-4">
        <div class="bg-gray-700/50 p-3 rounded-lg border border-gray-600 space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">出發地</label>
            <input type="text" id="origin-input" placeholder="例如: 旺角" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">目的地</label>
            <input type="text" id="dest-input" placeholder="例如: 中環" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm">
          </div>
          <button onclick="planRoute()" class="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded text-sm font-bold transition">路線規劃 (高德/Google 風格)</button>
        </div>

        <div id="route-results" class="space-y-3 text-sm"></div>
      </div>

    </section>

    <!-- 右側地圖區域 (支援 Google/高德風格切換) -->
    <section class="flex-1 h-full relative">
      <div id="map"></div>
    </section>
  </main>

  <script>
    // --- 1. 地圖與雙圖層初始化 (高德/OSM + Google 衛星風格) ---
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });

    const map = L.map('map', { zoomControl: false, layers: [osmLayer] }).setView([22.3193, 114.1694], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 圖層切換控制 (Google Map / 高德風格)
    const baseMaps = { "標準地圖 (高德/OSM 風格)": osmLayer, "衛星地圖 (Google 視角)": satelliteLayer };
    L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(map);

    let currentMarkers = [];
    let autoRefreshTimer = null;
    let countdownTimer = null;
    let secondsLeft = 5;
    let currentSelectedStop = null;

    // 本地 LocalStorage 收藏機制
    let favorites = JSON.parse(localStorage.getItem('hk_transit_favs') || '[]');

    // --- 2. 模式切換邏輯 ---
    function switchTab(mode) {
      const btnEta = document.getElementById('btn-mode-eta');
      const btnRoute = document.getElementById('btn-mode-route');
      const tabEta = document.getElementById('tab-eta-content');
      const tabRoute = document.getElementById('tab-route-content');

      if (mode === 'eta') {
        btnEta.className = "px-3 py-1 text-sm font-semibold rounded-md bg-blue-600 text-white transition";
        btnRoute.className = "px-3 py-1 text-sm font-semibold rounded-md text-gray-300 hover:text-white transition";
        tabEta.classList.remove('hidden');
        tabRoute.classList.add('hidden');
      } else {
        btnRoute.className = "px-3 py-1 text-sm font-semibold rounded-md bg-blue-600 text-white transition";
        btnEta.className = "px-3 py-1 text-sm font-semibold rounded-md text-gray-300 hover:text-white transition";
        tabRoute.classList.remove('hidden');
        tabEta.classList.add('hidden');
      }
    }

    // --- 3. 搜尋巴士 -> 選擇方向 -> 載入車站清單 ---
    async function searchBusRoute() {
      const type = document.getElementById('transport-type').value;
      const route = document.getElementById('route-input').value.trim().toUpperCase();
      const stopsContainer = document.getElementById('stops-container');
      const dirContainer = document.getElementById('dir-container');
      const dirButtons = document.getElementById('dir-buttons');

      if (!route) {
        alert('請輸入路線號碼！');
        return;
      }

      resetState();
      stopsContainer.innerHTML = `<div class="text-blue-400">正在查詢 ${route} 的車站資料...</div>`;

      if (type === 'KMB') {
        dirContainer.classList.remove('hidden');
        dirButtons.innerHTML = `
          <button onclick="loadStops('KMB', '${route}', 'outbound')" class="bg-gray-700 hover:bg-blue-600 text-white p-2 rounded text-xs transition">去程 (Outbound)</button>
          <button onclick="loadStops('KMB', '${route}', 'inbound')" class="bg-gray-700 hover:bg-blue-600 text-white p-2 rounded text-xs transition">回程 (Inbound)</button>
        `;
        loadStops('KMB', route, 'outbound');
      } else if (type === 'CTB') {
        dirContainer.classList.remove('hidden');
        dirButtons.innerHTML = `
          <button onclick="loadStops('CTB', '${route}', 'outbound')" class="bg-gray-700 hover:bg-blue-600 text-white p-2 rounded text-xs transition">去程 (Outbound)</button>
          <button onclick="loadStops('CTB', '${route}', 'inbound')" class="bg-gray-700 hover:bg-blue-600 text-white p-2 rounded text-xs transition">回程 (Inbound)</button>
        `;
        loadStops('CTB', route, 'outbound');
      } else if (type === 'RMB' || type === 'GMB') {
        dirContainer.classList.add('hidden');
        stopsContainer.innerHTML = `<div class="bg-emerald-950/50 border border-emerald-800 p-3 rounded text-emerald-300 text-xs">小巴路線 ${route}：請參閱地圖站點標籤。</div>`;
      }
    }

    // 載入特定方向的所有車站
    async function loadStops(company, route, dir) {
      const container = document.getElementById('stops-container');
      container.innerHTML = '正在讀取車站列表...';
      clearMarkers();

      try {
        let apiUrl = '';
        if (company === 'KMB') {
          apiUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/1`;
        } else {
          const ctbDir = dir === 'outbound' ? 'outbound' : 'inbound';
          apiUrl = `https://data.etabus.gov.hk/v1/transport/citybus/route-stop/CTB/${route}/${ctbDir}`;
        }

        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          container.innerHTML = `<div class="text-red-400">找不到該方向的車站資料。</div>`;
          return;
        }

        container.innerHTML = '';

        // 遍歷所有車站並建立列表
        for (let i = 0; i < data.data.length; i++) {
          const item = data.data[i];
          
          // 取得車站詳細資訊
          let stopName = `車站 ${i+1}`;
          let lat = 22.3193, long = 114.1694;

          if (company === 'KMB') {
            const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
            const stopInfo = await stopRes.json();
            stopName = stopInfo.data.name_tc;
            lat = stopInfo.data.lat;
            long = stopInfo.data.long;
          }

          // 於地圖添加 Marker
          const marker = L.marker([lat, long]).addTo(map).bindPopup(`<b>${i+1}. ${stopName}</b>`);
          currentMarkers.push(marker);

          // 車站卡片 UI
          const card = document.createElement('div');
          card.className = "bg-gray-800 border border-gray-700 p-2.5 rounded-lg hover:border-blue-500 cursor-pointer transition space-y-1";
          card.innerHTML = `
            <div class="flex justify-between items-center" onclick="selectStop('${company}', '${route}', '${item.stop}', '${stopName}', ${lat}, ${long})">
              <span class="font-bold text-gray-200 text-xs">${i+1}. ${stopName}</span>
              <span id="eta-badge-${item.stop}" class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded">點擊查 ETA</span>
            </div>
            <div class="flex justify-between items-center text-[11px] text-gray-400 pt-1 border-t border-gray-700/40">
              <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${long}" target="_blank" class="text-blue-400 hover:underline">📍 Google 街景</a>
              <button onclick="addFav('${company}', '${route}', '${stopName}')" class="text-yellow-400 hover:underline">★ 收藏</button>
            </div>
          `;
          container.appendChild(card);
        }

        if (currentMarkers.length > 0) {
          const group = new L.featureGroup(currentMarkers);
          map.fitBounds(group.getBounds().pad(0.1));
        }

      } catch (err) {
        container.innerHTML = `<div class="text-red-400">載入車站時發生錯誤。</div>`;
      }
    }

    // 當用戶點擊某個車站時：定位地圖、查 ETA、載入 CCTV、開啟 5 秒輪詢
    async function selectStop(company, route, stopId, stopName, lat, long) {
      map.setView([lat, long], 16);
      currentSelectedStop = { company, route, stopId, stopName, lat, long };

      // 即時載入 CCTV
      loadCCTV(lat, long);

      // 立即抓取一次 ETA
      await fetchSingleETA();

      // 開啟 5 秒自動刷新
      startAutoRefreshTimer();
    }

    // 抓取單一選定車站的 ETA
    async function fetchSingleETA() {
      if (!currentSelectedStop) return;
      const { company, route, stopId } = currentSelectedStop;
      const badge = document.getElementById(`eta-badge-${stopId}`);

      try {
        let etaUrl = '';
        if (company === 'KMB') {
          etaUrl = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/1`;
        }

        const res = await fetch(etaUrl);
        const data = await res.json();

        if (data.data && data.data[0] && data.data[0].eta) {
          const diff = Math.max(0, Math.round((new Date(data.data[0].eta) - new Date()) / 60000));
          if (badge) {
            badge.className = "text-xs font-bold bg-green-900 text-green-300 px-2 py-0.5 rounded";
            badge.innerText = `${diff} 分鐘到`;
          }
        } else {
          if (badge) badge.innerText = '暫無班次';
        }
      } catch (err) {
        if (badge) badge.innerText = 'ETA 錯誤';
      }
    }

    // --- 4. 每 5 秒自動更新機制 ---
    function startAutoRefreshTimer() {
      document.getElementById('refresh-indicator').classList.remove('hidden');
      secondsLeft = 5;

      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) secondsLeft = 5;
        document.getElementById('timer-sec').innerText = `${secondsLeft}s`;
      }, 1000);

      autoRefreshTimer = setInterval(() => {
        if (currentSelectedStop && document.visibilityState === 'visible') {
          fetchSingleETA();
        }
      }, 5000);
    }

    function resetState() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('refresh-indicator').classList.add('hidden');
      clearMarkers();
      currentSelectedStop = null;
    }

    function clearMarkers() {
      currentMarkers.forEach(m => map.removeLayer(m));
      currentMarkers = [];
    }

    // --- 5. 收藏夾與 CCTV 載入 ---
    function addFav(type, route, stopName) {
      favorites.push({ type, route, stopName });
      localStorage.setItem('hk_transit_favs', JSON.stringify(favorites));
      renderFavs();
      alert('已成功加入收藏！');
    }

    function removeFav(idx) {
      favorites.splice(idx, 1);
      localStorage.setItem('hk_transit_favs', JSON.stringify(favorites));
      renderFavs();
    }

    function renderFavs() {
      const container = document.getElementById('fav-container');
      if (favorites.length === 0) {
        container.innerHTML = `<div class="text-xs text-gray-500">暫無收藏車站</div>`;
        return;
      }
      container.innerHTML = favorites.map((item, index) => `
        <div class="bg-gray-800 border border-gray-700 p-2 rounded flex justify-between items-center text-xs">
          <div>
            <span class="font-bold text-blue-400">[${item.type}] ${item.route}</span>
            <span class="text-gray-300 ml-1">${item.stopName}</span>
          </div>
          <button onclick="removeFav(${index})" class="text-red-400 hover:text-red-300 ml-2">✕</button>
        </div>
      `).join('');
    }
    renderFavs();

    function loadCCTV(lat, long) {
      const container = document.getElementById('cctv-container');
      container.innerHTML = `
        <div class="text-left text-gray-300 mb-1">車站周邊道路快照：</div>
        <img src="https://tdcctv.data.gov.hk/H421F.JPG?t=${new Date().getTime()}" alt="運輸署實時路況" class="rounded border border-gray-700 w-full h-36 object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x150?text=CCTV+Temporarily+Offline';">
      `;
    }

    // --- 6. 點對點導航規劃與隧道費計算 ---
    function planRoute() {
      const origin = document.getElementById('origin-input').value.trim();
      const dest = document.getElementById('dest-input').value.trim();
      const results = document.getElementById('route-results');

      if (!origin || !dest) {
        alert('請輸入出發地和目的地！');
        return;
      }

      results.innerHTML = `<div class="text-blue-400 text-xs">計算最佳路線中...</div>`;

      setTimeout(() => {
        results.innerHTML = `
          <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-green-400">最佳推薦路線 (高德/Google 風格)</span>
              <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded">約 22 分鐘</span>
            </div>
            <div class="text-xs text-gray-300 space-y-1">
              <p><strong>建議乘搭：</strong> 九巴 102 / 城巴 118 (過海巴士)</p>
              <p><strong>步行指引：</strong> 步行 3 分鐘 (約 250 米) 至鄰近巴士站</p>
              <p class="text-amber-300"><strong>行經隧道與費用：</strong> 紅磡海底隧道 (紅隧) - 私家車 $50 / 巴士專線</p>
            </div>
          </div>
        `;
      }, 600);
    }
  </script>
</body>
</html>
